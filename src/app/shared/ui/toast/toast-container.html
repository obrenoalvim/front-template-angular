<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="min-w-64 rounded px-4 py-2 text-sm text-white shadow-lg"
      [class.bg-green-600]="toast.variant === 'success'"
      [class.bg-red-600]="toast.variant === 'error'"
      [class.bg-gray-800]="toast.variant === 'info'"
      role="status"
    >
      <div class="flex items-center justify-between gap-4">
        <span>{{ toast.message }}</span>
        <button type="button" (click)="toastService.dismiss(toast.id)" aria-label="Dismiss">
          ✕
        </button>
      </div>
    </div>
  }
</div>
