<div class="mx-auto flex max-w-2xl flex-col gap-6 py-12">
  <h1 class="text-xl font-semibold">{{ 'admin.title' | translate }}</h1>

  <app-card>
    @if (usersResource.isLoading()) {
      <p class="text-sm text-gray-500">…</p>
    } @else {
      <table class="w-full text-left text-sm">
        <thead>
          <tr>
            <th class="py-2 font-medium">{{ 'admin.email' | translate }}</th>
            <th class="py-2 font-medium">{{ 'admin.role' | translate }}</th>
          </tr>
        </thead>
        <tbody>
          @for (user of usersResource.value(); track user.id) {
            <tr>
              <td class="py-2">{{ user.email }}</td>
              <td class="py-2">{{ user.role }}</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </app-card>
</div>
