<div class="mx-auto flex max-w-sm flex-col gap-4 py-12">
  <app-card>
    <h1 class="mb-4 text-xl font-semibold">{{ 'auth.register.title' | translate }}</h1>
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <app-text-field
        [label]="'auth.fields.email' | translate"
        type="email"
        formControlName="email"
        [error]="
          form.controls.email.touched && form.controls.email.errors?.['zod']
            ? (form.controls.email.errors!['zod'] | translate)
            : null
        "
      />
      <app-text-field
        [label]="'auth.fields.password' | translate"
        type="password"
        formControlName="password"
        [error]="
          form.controls.password.touched && form.controls.password.errors?.['zod']
            ? (form.controls.password.errors!['zod'] | translate)
            : null
        "
      />
      <app-button type="submit" [disabled]="form.invalid">{{
        'auth.register.submit' | translate
      }}</app-button>
    </form>
    <p class="mt-4 text-sm">
      {{ 'auth.register.haveAccount' | translate }}
      <a appLocaleLink="/login" class="underline">{{ 'auth.register.loginLink' | translate }}</a>
    </p>
  </app-card>
</div>
