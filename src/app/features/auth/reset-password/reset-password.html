<div class="mx-auto flex max-w-sm flex-col gap-4 py-12">
  <app-card>
    <h1 class="mb-4 text-xl font-semibold">{{ 'auth.resetPassword.title' | translate }}</h1>
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <app-text-field
        [label]="'auth.fields.newPassword' | translate"
        type="password"
        formControlName="password"
      />
      <app-text-field
        [label]="'auth.fields.confirmPassword' | translate"
        type="password"
        formControlName="confirmPassword"
        [error]="form.touched && form.errors?.['zod'] ? (form.errors!['zod'] | translate) : null"
      />
      <app-button type="submit" [disabled]="form.invalid">{{
        'auth.resetPassword.submit' | translate
      }}</app-button>
    </form>
  </app-card>
</div>
