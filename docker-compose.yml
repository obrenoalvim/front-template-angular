# docker-compose.yml
services:
  app:
    build:
      context: .
      # API_BASE_URL/SITE_URL must be passed as build args too, not just
      # runtime `environment` — API_BASE_URL in particular is baked into the
      # client bundle at build time (see Dockerfile), which a runtime-only
      # env var can never change after the image exists.
      #
      # Uses DOCKER_-prefixed variable names deliberately, not API_BASE_URL/
      # SITE_URL directly: Compose auto-loads this project's own .env file for
      # ${...} substitution, and that file already defines API_BASE_URL/
      # SITE_URL for `npm run dev` (pointing at :4200, not this container's
      # :4000) — reusing the same names here would silently bake the wrong
      # SITE_URL into the image every time.
      args:
        API_BASE_URL: ${DOCKER_API_BASE_URL:-http://127.0.0.1:3000/api}
        SITE_URL: ${DOCKER_SITE_URL:-http://localhost:4000}
    ports:
      - '4000:4000'
    environment:
      API_BASE_URL: ${DOCKER_API_BASE_URL:-http://127.0.0.1:3000/api}
      SITE_URL: ${DOCKER_SITE_URL:-http://localhost:4000}
      PORT: 4000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
