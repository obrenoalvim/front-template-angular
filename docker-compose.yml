# docker-compose.yml
services:
  app:
    build: .
    ports:
      - '4000:4000'
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:3000/api}
      SITE_URL: ${SITE_URL:-http://localhost:4000}
      PORT: 4000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
